name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mumble:
        image: mumblevoip/mumble-server:latest
        env:
          # Murmur globally bans an address after 10 connection attempts in 120 s, and
          # LiveServerIntegrationTest's readiness probe retries once a second for up to a minute:
          # a container slow to accept would ban the runner, and every test after it would fail
          # on a handshake the server refuses to answer — indistinguishable from a client bug.
          # The ban cannot be lifted, only waited out, so the whole run would be lost. Nothing a
          # throwaway test container gets from the protection it exists to give public servers.
          MUMBLE_CONFIG_autobanAttempts: 0
        ports:
          - 64738:64738/tcp
          - 64738:64738/udp
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes; don't leave the token readable by ./gradlew.
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Matches gradle-daemon-jvm.properties and jvmToolchain; without it the
          # daemon's JDK 21 comes from the runner image by luck, not by declaration.
          java-version: '21'
      # Avoids the proprietary gradle-actions-caching component that v6 defaults to.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build and test
        env:
          MUMBLE_TEST_SERVER: localhost
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest assembleDebugAndroidTest --stacktrace
      - name: Build and run host C++ core tests
        # cpp/core has no Android dependency by construction, so it is tested on the runner
        # directly. This is also the only place libopus is reachable from a test at all —
        # libdumble.so is built for Android ABIs only.
        run: |
          cmake -S app/src/main/cpp/host -B build/host
          cmake --build build/host -j
          ctest --test-dir build/host --output-on-failure
      - name: Verify attribution
        run: ./gradlew verifyShippedGroups --stacktrace
