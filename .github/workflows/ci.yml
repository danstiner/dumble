name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mumble:
        image: mumblevoip/mumble-server:latest
        ports:
          - 64738:64738/tcp
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes; don't leave the token readable by ./gradlew.
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Matches gradle-daemon-jvm.properties and jvmToolchain; without it the
          # daemon's JDK 21 comes from the runner image by luck, not by declaration.
          java-version: '21'
      # Avoids the proprietary gradle-actions-caching component that v6 defaults to.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Robolectric downloads a 191 MB android-all jar the first time a test needs it, into ~/.m2
      # rather than the Gradle home setup-gradle caches — so every run paid for it again.
      - name: Cache the Robolectric runtime jar
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      # Gradle writes a configuration cache entry every run and can never reuse one, because it
      # lives in the project directory and not the Gradle home. github.sha keeps it fresh: the
      # exact key always misses, so the entry is rewritten, and restore-keys takes the most recent
      # prefix match. A stale entry is not a hazard — Gradle validates its own inputs and falls
      # back to configuring from scratch.
      - name: Cache the Gradle configuration cache
        uses: actions/cache@v4
        with:
          path: .gradle/configuration-cache
          key: configcache-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: configcache-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Build and test
        env:
          MUMBLE_TEST_SERVER: localhost
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest assembleDebugAndroidTest --build-cache --stacktrace
      - name: Build and run host C++ core tests
        # cpp/core has no Android dependency by construction, so it is tested on the runner
        # directly. This is also the only place libopus is reachable from a test at all —
        # libdumble.so is built for Android ABIs only.
        run: |
          cmake -S app/src/main/cpp/host -B build/host
          cmake --build build/host -j
          ctest --test-dir build/host --output-on-failure
      - name: Verify attribution
        run: ./gradlew verifyShippedGroups --build-cache --stacktrace
